<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="cardTitle cardDesc">
  <title id="cardTitle">Tales of Space Adventures</title>
  <desc id="cardDesc">Social sharing card for Tales of Space Adventures with gradient backdrop and SAT branding</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081726" />
      <stop offset="55%" stop-color="#0e3552" />
      <stop offset="100%" stop-color="#17c3a2" />
    </linearGradient>
    <linearGradient id="orbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e6ba8" />
      <stop offset="100%" stop-color="#17c3a2" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="1010" cy="120" r="220" fill="#ffffff" opacity="0.06"/>
  <circle cx="160" cy="560" r="190" fill="#ffffff" opacity="0.07"/>

  <g transform="translate(95,170)">
    <circle cx="86" cy="86" r="70" fill="url(#orbGrad)" opacity="0.22"/>
    <circle cx="86" cy="86" r="46" fill="url(#orbGrad)"/>
    <ellipse cx="86" cy="86" rx="84" ry="30" fill="none" stroke="#59f2d6" stroke-width="8"/>
    <circle cx="158" cy="74" r="10" fill="#7fd3ff"/>
  </g>

  <g fill="#f4fbff" font-family="'Exo 2', 'Segoe UI', sans-serif">
    <text x="300" y="250" font-size="72" font-weight="800">TALES OF SPACE ADVENTURES</text>
    <text x="300" y="335" font-size="38" font-weight="600">Stories and movies first. Canon always consistent.</text>
    <text x="300" y="405" font-size="30" font-weight="500" opacity="0.95">spaceadventuretales  |  sat</text>
  </g>
</svg>
